# EngLearn 配置文件
# 敏感信息通过环境变量设置，不要写在此文件中
#
# 需要设置的环境变量:
#   LLM_API_KEY = 你的 API Key
#
# Windows 设置方式 (PowerShell):
#   [System.Environment]::SetEnvironmentVariable('LLM_API_KEY', 'sk-xxx', 'User')
# 设置后重启终端生效

llm:
  provider: custom                    # openai / ollama / custom
  model: deepseek-v4-pro              # 模型名称
  api_key: null                       # 通过环境变量 LLM_API_KEY 设置，勿在此填写
  base_url: https://api.deepseek.com  # 自定义 endpoint
  temperature: 0.7
  max_tokens: 2000

study:
  daily_word_count: 20    # 每日新学单词数
